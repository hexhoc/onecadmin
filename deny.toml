[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
include-dev = true
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
