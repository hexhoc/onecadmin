[package]
name = "onecadmin"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Администрирование кластеров 1С:Предприятия через RAS/RAC"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "=0.1.92"
chrono = { version = "=0.4.45", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
comfy-table = "7"
crossterm = { version = "=0.29.0", features = ["event-stream"] }
csv = "1"
encoding_rs = "=0.8.35"
file-rotate = "=0.8.0"
fs4 = { version = "1", features = ["sync"] }
futures = "=0.3.34"
indexmap = { version = "2", features = ["serde"] }
noyalib = "=0.0.18"
ratatui = "=0.30.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "local-time"] }
unicode-width = "=0.2.2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
rstest = "=0.26.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0  # должно быть 0
debug = true   # обязательно

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
